# ~/.tmux.conf — beginner-friendly config tuned for running Claude Code
# across multiple projects. Every line is commented so you can learn what
# it does and tweak freely. Reload after editing with:  prefix + r
# (or from a shell:  tmux source-file ~/.tmux.conf)

# ----------------------------------------------------------------------
# Colors / display
# ----------------------------------------------------------------------
# Tell programs inside tmux they have a 256-color terminal. "screen-256color"
# is the bulletproof choice on macOS (always present). If you later switch to
# iTerm2 / Ghostty / WezTerm / Kitty you can upgrade this to "tmux-256color"
# plus a true-color override for richer colors.
set -g default-terminal "screen-256color"

# Don't lag when you press Escape (matters a lot inside Claude Code & vim).
set -sg escape-time 10

# Let editors know when the terminal gains/loses focus.
set -g focus-events on

# ----------------------------------------------------------------------
# Quality-of-life
# ----------------------------------------------------------------------
# Turn the mouse on: click to switch panes, drag borders to resize,
# scroll to look back through output, click windows in the status bar.
# This single setting makes tmux feel normal while you're learning.
set -g mouse on

# Keep a big scrollback buffer (default is only 2000 lines).
set -g history-limit 50000

# Let apps inside tmux send escape sequences through to the real terminal.
# Claude Code's fullscreen mode uses this for clipboard copies and
# notifications; harmless for everything else.
set -g allow-passthrough on

# Number windows and panes starting at 1 (easier to reach than 0 on the row).
set -g base-index 1
setw -g pane-base-index 1

# When you close a window, renumber the rest so there are no gaps.
set -g renumber-windows on

# Keep window names you set yourself; don't let programs rename them.
set -g allow-rename off
setw -g automatic-rename off

# ----------------------------------------------------------------------
# Keybindings
# ----------------------------------------------------------------------
# The "prefix" is the key combo you press before any tmux command.
# Default is Ctrl-b. We keep it so every tutorial you read matches.
# (To try Ctrl-a instead someday, uncomment the next 3 lines.)
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Split panes with | and - (more intuitive than the default " and %).
# New panes open in the SAME directory as the current one.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows also open in the current directory.
bind c new-window -c "#{pane_current_path}"

# Move between panes with prefix + h/j/k/l (vim-style). Arrow keys still work.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Jump straight to the construct session from anywhere with prefix + g ("go
# to hub"): ocp-construct on the work Mac, construct on the personal Mac,
# whichever exists. "=" means exact name match, so "ocp-construct-wt" or
# "construct-test" are never picked by mistake.
bind g if-shell "tmux has-session -t =ocp-construct 2>/dev/null" \
  "switch-client -t =ocp-construct" \
  "if-shell 'tmux has-session -t =construct 2>/dev/null' 'switch-client -t =construct' 'display-message \"no construct session running\"'"

# Reload this config without restarting tmux.
bind r source-file ~/.tmux.conf \; display "tmux config reloaded!"

# ----------------------------------------------------------------------
# Copy mode (scrolling back & copying text)
# ----------------------------------------------------------------------
# Use vim-style keys when navigating scrollback (prefix + [ to enter).
setw -g mode-keys vi

# Press v to start selecting, y to copy. On macOS, copy goes straight to the
# system clipboard via pbcopy, and so does releasing a mouse drag-selection.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ----------------------------------------------------------------------
# Active pane: make it obvious which pane has focus
# ----------------------------------------------------------------------
# Three cues stack up so the focused pane is unmistakable, even with an
# assistant-opened pane sitting to the right:
#   1. Border colour: bright blue around the active pane, dim grey elsewhere.
#   2. Dimming: inactive panes get a slightly darker background so the
#      active one looks "lit". If you dislike the dimming (or use a light
#      terminal theme), comment out the two window-style lines below.
#   3. Label: a small status line on top of every pane showing its number,
#      the pane title and its directory; the active pane's label is a solid
#      blue box with a marker. Claude Code sets the pane title to the
#      conversation topic (its process name is just a version number), and
#      a plain shell sets it to the hostname.
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour32,bold"
set -g pane-border-lines heavy
# Add arrows on the border pointing at the active pane as well as colour.
set -g pane-border-indicators both

set -g window-style "bg=colour234"
set -g window-active-style "bg=default"

set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[bg=colour32 fg=colour255 bold] > #P #[default]#[fg=colour32 bold] #{pane_title} #[fg=colour250](#{b:pane_current_path}),#[fg=colour240] #P #{pane_title} (#{b:pane_current_path})}"

# prefix + q flashes big pane numbers; keep them up longer so you can read
# them and press a number to jump (default is 1 second).
set -g display-panes-time 2500
set -g display-panes-colour colour240
set -g display-panes-active-colour colour32

# ----------------------------------------------------------------------
# Status bar (the strip along the bottom)
# ----------------------------------------------------------------------
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour250"

# Two rows, so a long window list never pushes anything off screen:
#   row 1 (status-format[0], tmux's default layout): the window list only,
#          full width (status-left and status-right are empty on purpose).
#   row 2 (status-format[1]): session name on the left; network segment and
#          date/time on the right.
# tmux cannot wrap the window list onto more rows by itself; if even a full
# row overflows, it trims with < > markers. Names are cut to 24 characters
# (with an ellipsis) so more windows fit.
set -g status 2
set -g status-left ""
set -g status-right ""
# network: eth / wifi / vpn/eth / vpn/wifi (red "vpn/wifi!" = VPN on Wi-Fi while Ethernet is up)
set -g status-format[1] "#[align=left]#[bg=colour32,fg=colour255,bold] #S #[default]#[align=right]#(~/.local/bin/net-status 2>/dev/null)  #[fg=colour250]%a %b %d  #[bold]%I:%M %p "

# Windows: index:name (trimmed to 24), with the active one highlighted.
setw -g window-status-current-format "#[bg=colour32,fg=colour255,bold] #I:#{=/24/…:window_name} "
setw -g window-status-format " #I:#{=/24/…:window_name} "
